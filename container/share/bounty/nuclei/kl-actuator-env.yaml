id: kl-actuator-env
info:
  name: Spring Boot actuator /env exposed
  author: kali-lab
  severity: high
  description: kali-lab curated exposure check (CONTRACTS §10.6). A hit is a lead to confirm by hand.
  tags: kali-lab,exposure

http:
  - method: GET
    path:
      - "{{RootURL}}/actuator/env"
    max-size: 65536
    redirects: false
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        part: body
        words: ["propertySources", "activeProfiles"]
        condition: or
      - type: word
        part: header
        words: ["text/html"]
        negative: true
