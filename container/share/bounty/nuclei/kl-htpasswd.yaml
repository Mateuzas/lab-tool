id: kl-htpasswd
info:
  name: Exposed .htpasswd
  author: kali-lab
  severity: medium
  description: kali-lab curated exposure check (CONTRACTS §10.6). A hit is a lead to confirm by hand.
  tags: kali-lab,exposure

http:
  - method: GET
    path:
      - "{{RootURL}}/.htpasswd"
    max-size: 65536
    redirects: false
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex: ['(?m)^[^:\s]+:(\$apr1\$|\$2[aby]\$|\{SHA\})']
      - type: word
        part: header
        words: ["text/html"]
        negative: true
