# Checks on every push and pull request. Linux runners only (cheapest); macOS builds belong in
# the release workflow. Live tests that need Docker Desktop + a VPN stay local (`make test`).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: make lint

  app:
    name: App (TypeScript + Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # System libraries Tauri needs to compile on Linux.
      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      - name: Type-check and build the UI
        run: npm run build
      - name: Rust unit tests
        working-directory: app/src-tauri
        run: cargo test --locked

  container:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the lab image (not pushed)
        run: docker build -t kali-lab:ci container/

  bounty-unit:
    name: Bounty unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # 3.9 is the oldest python3 the Mac code supports (container/share/bounty/guard_policy.py).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: bounty package (stdlib only)
        run: python3 -B -m unittest discover -s bounty/tests -t .
      - name: scope guard policy
        run: python3 -B -m unittest tests/test_guard_policy.py

  # Scope guard end to end (tests/bounty-guard-test.sh): builds kali-lab:guard-test, runs a separate
  # guard container on 127.0.0.1:18081 and a fake target on --internal Docker networks. All local:
  # nothing is sent to the internet or to any real program.
  guard-suite:
    name: Guard integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Run the suite
        run: |
          set -o pipefail
          tests/bounty-guard-test.sh 2>&1 | tee guard-test.log
      - name: Upload the suite log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guard-test-log
          path: guard-test.log
          if-no-files-found: ignore

  # The one check to require in branch protection: green only if every job above passed, so
  # adding jobs later never means editing the protection rules.
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, app, container, bounty-unit, guard-suite]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
