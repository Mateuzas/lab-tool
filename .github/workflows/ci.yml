# Checks on every push and pull request. Linux runners only (cheapest); macOS builds belong in
# the release workflow. Live tests that need Docker Desktop + a VPN stay local (`make test`).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: make lint

  app:
    name: App (TypeScript + Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # System libraries Tauri needs to compile on Linux.
      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      - name: Type-check and build the UI
        run: npm run build
      - name: Rust unit tests
        working-directory: app/src-tauri
        run: cargo test --locked

  container:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the lab image (not pushed)
        run: docker build -t kali-lab:ci container/

  # The one check to require in branch protection: green only if every job above passed, so
  # adding jobs later never means editing the protection rules.
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, app, container]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
